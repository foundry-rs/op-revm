[package]
name = "op-revm"
version = "18.0.0"
edition = "2021"
rust-version = "1.91.0"
authors = ["Dragan Rakita <dragan0rakita@gmail.com>"]
description = "Optimism variant of Revm - patched for TIP-1016 Handler trait compatibility"
license = "MIT"
repository = "https://github.com/tempoxyz/op-revm"
readme = "README.md"
keywords = ["revm", "evm", "ethereum", "blockchain", "no_std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[lints.rust.rust_2018_idioms]
level = "deny"
priority = -1

[lints.rustdoc]
all = "warn"

[dependencies]
revm = { version = "37.0.0", default-features = false }
auto_impl = "1.3.0"
serde = { version = "1.0", features = ["derive", "rc"], optional = true, default-features = false }

[dev-dependencies]
rstest = "0.26.0"
alloy-sol-types = { version = "1.5.2", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
serde_json = { version = "1.0", features = ["alloc", "preserve_order"], default-features = false }
serde = { version = "1.0", features = ["derive", "rc"], default-features = false }
alloy-primitives = { version = "1.5.2", default-features = false }

[features]
default = ["std", "c-kzg", "secp256k1", "portable", "blst"]
std = [
    "serde?/std",
    "revm/std",
    "alloy-sol-types/std",
    "sha2/std",
    "serde_json/std",
    "alloy-primitives/std",
]
hashbrown = ["revm/hashbrown"]
serde = ["dep:serde", "revm/serde", "alloy-primitives/serde"]
portable = ["revm/portable"]

dev = [
    "memory_limit",
    "optional_balance_check",
    "optional_block_gas_limit",
    "optional_eip3541",
    "optional_eip3607",
    "optional_no_base_fee",
]
memory_limit = ["revm/memory_limit"]
optional_balance_check = ["revm/optional_balance_check"]
optional_block_gas_limit = ["revm/optional_block_gas_limit"]
optional_eip3541 = ["revm/optional_eip3541"]
optional_eip3607 = ["revm/optional_eip3607"]
optional_no_base_fee = ["revm/optional_no_base_fee"]
optional_fee_charge = ["revm/optional_fee_charge"]

secp256k1 = ["revm/secp256k1"]
c-kzg = ["revm/c-kzg"]
blst = ["revm/blst"]
bn = ["revm/bn"]

[patch.crates-io]
revm = { git = "https://github.com/bluealloy/revm", rev = "a1a1824" }
revm-bytecode = { git = "https://github.com/bluealloy/revm", rev = "a1a1824" }
revm-database = { git = "https://github.com/bluealloy/revm", rev = "a1a1824" }
revm-state = { git = "https://github.com/bluealloy/revm", rev = "a1a1824" }
revm-primitives = { git = "https://github.com/bluealloy/revm", rev = "a1a1824" }
revm-interpreter = { git = "https://github.com/bluealloy/revm", rev = "a1a1824" }
revm-database-interface = { git = "https://github.com/bluealloy/revm", rev = "a1a1824" }
